{% extends "base.html" %}
{% block title %}Inloggen{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-12">
  <div class="card bg-warm-light border-warm">
    <h1 class="text-2xl font-semibold mb-4">Inloggen</h1>
    {% if form.errors %}<p class="text-danger text-sm mb-3">Gebruikersnaam of wachtwoord klopt niet.</p>{% endif %}
    <form method="post" class="space-y-3">
      {% csrf_token %}
      <label class="block text-sm">Gebruikersnaam<input name="username" class="input mt-1" autofocus required></label>
      <label class="block text-sm">Wachtwoord<input name="password" type="password" class="input mt-1" required></label>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-full justify-center">Inloggen</button>
    </form>
  </div>
</div>
{% endblock %}
