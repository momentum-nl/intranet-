[project]
name = "momentum-intranet"
version = "0.1.0"
description = "Momentum intranet: links, notificaties, pin of shame, corvee, picnic"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "django-allauth[socialaccount]>=65.0",
    "dj-database-url>=2.3.0",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.8",
    "gunicorn>=23.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "DJ", "RUF"]
ignore = ["E501", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["web_app"]
testpaths = ["web_app/tests"]
env = []
